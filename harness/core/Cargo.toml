[package]
name = "mistralai-unified-harness"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
benchmark = []
extension-module = ["python-binding", "pyo3/extension-module"]
node-binding = ["dep:napi", "dep:napi-derive"]
python-binding = ["dep:pyo3"]

[[bin]]
name = "benchmark-engine"
path = "src/bin/benchmark_engine.rs"
required-features = ["benchmark"]

[[bin]]
name = "benchmark-tool-discovery"
path = "src/bin/benchmark_tool_discovery.rs"
required-features = ["benchmark"]

[dependencies]
deno_ast = { version = "=0.53.3", features = ["transpiling"] }
deno_core = { version = "=0.409.0", default-features = false, features = ["reactor-tokio"] }
jsonschema = { version = "=0.49.1", default-features = false }
napi = { version = "3.11.0", optional = true }
napi-derive = { version = "3.6.0", optional = true }
pyo3 = { version = "0.29.0", features = ["abi3-py312"], optional = true }
rmcp = { version = "=3.1.2", default-features = false }
schemars = "1.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.24.0", features = ["v5"] }

[dev-dependencies]
glob = "0.3.4"
insta = { version = "1.48.0", features = ["json"] }
rstest = "0.26.1"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0
